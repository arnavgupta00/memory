name: architecture-0005.4.4-baseline-slice
mode: full-context
agent:
  backend: node
  entrypoint: src/agents/current/dist/host.js
  provider_model_limits:
    - provider: openai
      model: gpt-5.4-nano-2026-03-17
      max_concurrency: 16
      token_budget: 200000
      window_seconds: 60
  models:
    select:
      kind: generation
      provider: openai
      model: gpt-5.4-nano-2026-03-17
      temperature: 1
      reasoning_effort: low
      max_output_tokens: 8000
      timeout_seconds: 300
      concurrency: 16
      max_retries: 6
      input_price_per_million: 0.20
      output_price_per_million: 1.25
  options:
    window_turns: 2
    window_stride: 1
    top_k: 96
    char_budget: 140000
    max_turn_chars: 4000
    temporal_boost: 0.15
    select_enabled: true
    select_prompt: select-v4
    package_max_turns: 40
    package_char_budget: 40000
    package_supporting_enabled: true
    package_sibling_sessions_enabled: true
    package_sibling_session_max: 12
    package_full_session_enabled: true
    package_session_turn_max: 24
    package_lexical_floor_enabled: false
    session_index_enabled: false
    series_expand_enabled: false
    answer_prompt: answer-v8-preference
answer:
  provider: openai
  model: gpt-5.4-nano-2026-03-17
  temperature: 1
  reasoning_effort: medium
  max_output_tokens: 16000
  timeout_seconds: 300
  concurrency: 16
  max_retries: 6
  input_price_per_million: 0.20
  output_price_per_million: 1.25
judge:
  provider: openai
  model: gpt-4o-2024-08-06
  temperature: 0
selection:
  strategy: canary-1
execution:
  case_concurrency: 16
  capture_model_io: true
  auto_export_final_svg: false
