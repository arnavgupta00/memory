name: architecture-0003.2-openai-b9-c9
mode: full-context
agent:
  backend: node
  entrypoint: src/agents/architecture-0003.2-hybrid-graph-reader/dist/host.js
  provider_model_limits:
    - provider: openai
      model: gpt-5-nano-2025-08-07
      max_concurrency: 6
      token_budget: 480000
      window_seconds: 60
  models:
    contexto:
      kind: generation
      provider: openai
      model: gpt-5-nano-2025-08-07
      temperature: 1
      reasoning_effort: low
      max_output_tokens: 8000
      timeout_seconds: 300
      concurrency: 6
      max_retries: 6
      input_price_per_million: 0.05
      output_price_per_million: 0.40
    shino:
      kind: generation
      provider: openai
      model: gpt-5-nano-2025-08-07
      temperature: 1
      reasoning_effort: minimal
      max_output_tokens: 8000
      timeout_seconds: 300
      concurrency: 6
      max_retries: 6
      input_price_per_million: 0.05
      output_price_per_million: 0.40
    reader:
      kind: generation
      provider: openai
      model: gpt-5-nano-2025-08-07
      temperature: 1
      reasoning_effort: high
      max_output_tokens: 12000
      timeout_seconds: 300
      concurrency: 6
      max_retries: 6
      input_price_per_million: 0.05
      output_price_per_million: 0.40
  options:
    graph_batch_size: 9
    summary_batch_size: 9
    latest_raw_sessions: 9
    allow_graph_replacement: true
answer:
  provider: openai
  model: gpt-5-nano-2025-08-07
  temperature: 1
  reasoning_effort: high
  max_output_tokens: 8000
  timeout_seconds: 300
  concurrency: 6
  max_retries: 6
  input_price_per_million: 0.05
  output_price_per_million: 0.40
judge:
  provider: openai
  model: gpt-4o-2024-08-06
  temperature: 0
selection:
  strategy: canary-2
execution:
  case_concurrency: 6
  capture_model_io: true
  auto_export_final_svg: true
