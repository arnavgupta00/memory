[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memorybench"
version = "0.1.0"
description = "A reproducible LongMemEval-S benchmark harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Arnav" }]
dependencies = [
  "backoff>=2.2.1,<3",
  "google-genai>=1.0,<2",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "openai>=1.70,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "tenacity>=9.0,<10",
  "tqdm>=4.67,<5",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
memorybench = "longmemeval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/longmemeval", "src/agents"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["paid: makes real provider API calls and is opt-in"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cache", "data", "legacy", "runs", "submissions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["longmemeval", "agents"]
