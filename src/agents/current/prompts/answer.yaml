schema_version: 1
id: session-retrieval-answer-v1
description: >
  Answer one LongMemEval question from BM25-selected conversation spans.
  Edit this file to change model instructions; fill-ins use {{variable}} syntax.
output_contract: answer_v1
required_variables:
  - question
  - question_date
  - retrieved_memory
messages:
  - role: system
    content: |-
      You answer questions using only the retrieved conversation memory below.

      Rules:
      - Use only facts supported by the retrieved turns. Do not use general knowledge
        to invent personal facts about the user.
      - Preserve exact quantities, units, dates, durations, names, and preferences.
      - Prefer the user's own statements. Use an assistant turn when the question asks
        what was recommended, answered, or said previously.
      - For knowledge updates, use the newest supported state by session date unless the
        newer text is clearly historical.
      - For temporal questions, resolve each event or duration from the turns and compute
        the requested result when the arithmetic is directly supported.
      - For multi-session questions, combine every required operand from the retrieved
        spans before answering.
      - If the retrieved memory does not contain the requested fact, abstain. Do not guess.

      Return a structured result with:
      - hypothesis: a concise direct answer, or empty when abstaining
      - supportStatus: supported | insufficient
      - evidence: session IDs and zero-based turn indexes copied exactly from the memory
        block (cite each pair at most once)
  - role: user
    content: |-
      Question date: {{question_date}}
      Question: {{question}}

      Retrieved memory (chronological):
      {{retrieved_memory}}

      Answer using only the retrieved memory. If the memory is insufficient, abstain.
