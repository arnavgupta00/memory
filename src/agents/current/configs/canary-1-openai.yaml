name: canary-1-openai
mode: full-context
agent:
  entrypoint: agents.current:create_agent
  options:
    chain_of_note: true
    history_format: json
    prompt_template: prompts/full_history.yaml
answer:
  provider: openai
  model: gpt-4.1-2025-04-14
  temperature: 0
  max_output_tokens: 800
  timeout_seconds: 300
  concurrency: 1
  max_retries: 5
judge:
  provider: openai
  model: gpt-4o-2024-08-06
  temperature: 0
selection:
  strategy: canary-1
