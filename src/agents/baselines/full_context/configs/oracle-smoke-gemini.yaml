name: oracle-smoke-gemini
mode: oracle
agent:
  entrypoint: agents.baselines.full_context:create_agent
  options:
    chain_of_note: true
    history_format: json
    prompt_template: prompts/full_history.yaml
answer:
  provider: gemini
  model: gemini-3.1-pro-preview
  temperature: 0
  max_output_tokens: 800
  timeout_seconds: 120
  concurrency: 1
  max_retries: 5
judge:
  provider: openai
  model: gpt-4o-2024-08-06
  temperature: 0
selection:
  strategy: canonical-smoke
