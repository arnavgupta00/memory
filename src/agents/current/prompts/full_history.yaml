schema_version: 1
id: full-history-answer-v1
description: >-
  Baseline answer prompt. It gives the answer model every sanitized LongMemEval
  session, the question date, and the question.

# Every placeholder used by `template` must be declared here. The renderer fails
# before an API call if a placeholder is missing, misspelled, or undeclared.
required_variables:
  - answer_instruction
  - history
  - question_date
  - question
  - answer_cue

template: |-
  I will give you several history chats between you and a user. Please answer the question based on the relevant chat history.
  {answer_instruction}

  History Chats:
  {history}

  Current Date: {question_date}
  Question: {question}
  {answer_cue}

# `chain_of_note` in the architecture run config selects one of these variants.
# Variant values fill variables in the template above; they are not hidden in
# Python code.
variants:
  chain_of_note:
    answer_instruction: >-
      Answer the question step by step: first extract all the relevant information,
      and then reason over the information to get the answer.
    answer_cue: "Answer (step by step):"
  direct:
    answer_instruction: ""
    answer_cue: "Answer:"
