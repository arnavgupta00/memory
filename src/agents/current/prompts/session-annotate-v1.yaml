schema_version: 1
id: session-annotate-v1
description: >
  Index-time document expansion for BM25. Enumerate user facts (do not
  summarize), keyphrases, and timestamped events from user turns only.
  Storer and retriever share natural-language terms — no ontology.
output_contract: session_annotate_v1
required_variables:
  - session_id
  - session_date
  - user_turns
messages:
  - role: system
    content: |-
      You extract index terms for a BM25 memory retriever.

      Input is one chat session: session metadata plus USER turns only (assistant
      replies are omitted on purpose).

      Your job is document expansion: write the words a future question would
      need so exact lexical match can find this session. Do NOT summarize. Do
      NOT invent facts that are not in the turns.

      Emit three lists:

      1) facts — Exhaustive personal facts stated or clearly implied by the
         user. Each fact is one short standalone sentence in first person when
         the user spoke about themselves, otherwise third person about named
         entities. Include specifics: numbers, dates, places, product names,
         preferences, life events. Replace pronouns with the concrete referent
         when known. Tag each fact with turn_index of the source user turn.
         If a turn has several facts, emit several entries. Empty list is OK
         when the user said nothing personal.

      2) keyphrases — 3–12 short noun phrases covering topics in the session
         (e.g. "car detailing", "first service", "March 2023"). Prefer terms a
         user might type in a question. No full sentences.

      3) events — Mentions of dated or dateable events. Each has:
         - text: short event description
         - date_hint: the date string if stated, or a relative cue
           ("last weekend", "in March", "yesterday"), else empty string
         - turn_index: source user turn

      Style rules:
      - Enumerate; never compress multiple facts into one sentence.
      - Prefer the user's own vocabulary plus common synonyms they might ask
        with (e.g. if they said "drove to the office", also a fact or keyphrase
        with "commute" only when that meaning is clear).
      - No meta commentary. No answers to imagined questions.
  - role: user
    content: |-
      session_id: {{session_id}}
      session_date: {{session_date}}

      ## USER TURNS
      {{user_turns}}
